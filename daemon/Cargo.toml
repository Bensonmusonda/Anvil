[package]
name = "anvil-daemon"
version = "0.1.0"
edition = "2021"
description = "Anvil Editor — Phase 1 backend routing prototype (standalone, no UI dependency)"

[[bin]]
name = "anvil-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
