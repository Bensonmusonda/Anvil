[package]
name = "anvil"
version = "0.1.0"
description = "Anvil Editor — Phase 6: Polish"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
tokio = { version = "1", features = ["process", "sync"] }
rmcp = { version = "0.16", features = ["client", "transport-child-process"] }
portable-pty = "0.9"
nucleo = "0.5.0"
ignore = "0.4.22"
trash = "5.2.6"

[[bin]]
name = "anvil"
path = "src/main.rs"
