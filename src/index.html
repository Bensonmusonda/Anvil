<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anvil Editor — Phase 4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Anvil</h1>
    <span id="current-file" class="current-file">no file open</span>
    <span id="status-msg" class="status-msg"></span>
  </header>

  <div class="body">
    <aside id="sidebar">
      <div class="workspace-bar">
        <input id="workspace-path" type="text" placeholder="/path/to/your/project" />
        <button id="open-btn">Open</button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <div class="main-column">
      <div class="toolbar">
        <button id="save-btn" title="Write buffer to disk (snapshots previous content first)">Save</button>
        <button id="revert-btn" title="Restore from last snapshot">Revert</button>
        <button id="commit-btn" title="Clear snapshot — accept current disk state as final">Commit</button>
      </div>

      <main id="editor"></main>

      <div class="ai-bar">
        <input id="ai-prompt" type="text" placeholder="Ask AI — response inserts at cursor..." />
        <button id="ai-btn">Ask AI →</button>
      </div>
    </div>

    <aside id="agent-sidebar">
      <div class="agent-header">Agent Task</div>
      <div class="agent-panel">
        <pre id="agent-output" class="agent-output">(no agent task run yet)</pre>
        <textarea id="agent-prompt" placeholder="e.g. 'Read /path/to/file, then echo its first line back'"></textarea>
        <button id="agent-btn">Run Agent →</button>
      </div>
    </aside>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
