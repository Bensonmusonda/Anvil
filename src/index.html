<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anvil Editor — Phase 2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Anvil</h1>
    <span id="current-file" class="current-file">no file open</span>
  </header>

  <div class="body">
    <aside id="sidebar">
      <div class="workspace-bar">
        <input id="workspace-path" type="text" placeholder="/path/to/your/project" />
        <button id="open-btn">Open</button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <main id="editor"></main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
